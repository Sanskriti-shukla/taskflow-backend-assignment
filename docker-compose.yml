services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
    ports:
      - "5432:5432"
    volumes:
      - taskflow_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    environment:
      PORT: 3000
      NODE_ENV: development
      DB_NAME: taskflow
      DB_TEST_NAME: taskflow_test
      DB_USERNAME: taskflow
      DB_PASSWORD: taskflow
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DIALECT: postgres
      DB_LOGGING: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECRET_KEY: taskflow_access_secret_change_me_1234567890
      REFRESH_SECRET_KEY: taskflow_refresh_secret_change_me_1234567890
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 7d
      BCRYPT_COST: 12
    command: sh -c "npm run migration:run && npm run seed && npm start"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    environment:
      NODE_ENV: development
      DB_NAME: taskflow
      DB_TEST_NAME: taskflow_test
      DB_USERNAME: taskflow
      DB_PASSWORD: taskflow
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DIALECT: postgres
      DB_LOGGING: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECRET_KEY: taskflow_access_secret_change_me_1234567890
      REFRESH_SECRET_KEY: taskflow_refresh_secret_change_me_1234567890
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 7d
      BCRYPT_COST: 12
    command: sh -c "npm run wait:schema && npm run worker"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  taskflow_postgres_data:
